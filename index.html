    #menu {
      position: absolute;
      left: 0%;
      transform: translateX(-100%);
      height: 100%;
      width: 50%;
      transition: transform 200ms;
      border: solid white;
      box-sizing: border-box;
      z-index: 1;
      background-color: black;
      border-radius: 0 4vh 4vh 0;
      border-left: none;
    }

    #itemcont {
      position: absolute;
      width: 100%;
      top: 12%;
      height: auto;
      display: flex;
      flex-direction: column;
    }

    item {
      position: relative;
      width: 100%;
      aspect-ratio: 5;
      box-sizing: border-box;
      padding: 6px;
      font-weight: bold;
      font-size: 3vh;
      border-radius: 2vh;
    }

    item:active {
      background-color: grey;
    }

    #menu.show {
      transform: translateX(0%);
    }

    page {
      position: absolute;
      width: 100%;
      height: 88%;
      bottom: 0;
      display: none;
    }

    page.show {
      display: block;
    }

    #playbutton {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 40%;
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background-color: lightgreen;
      color: darkgreen;
      font-weight: bold;
      font-size: 6vh;
    }

    #playcont {
      position: absolute;
      height: 99%;
      width: 96%;
      left: 2%;
    }

    #roundname,
    #currteam,
    #currplayer {
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3vh;
      font-weight: bold;
      text-align: center;
      text-wrap: nowrap;
    }

    #currteam {
      top: 10%;
    }

    #currplayer {
      top: 15%;
      font-weight: normal;
    }

    #namecard {
      width: 50%;
      height: 30%;
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
    }

    #holdtosee {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #currnickname {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 4vh;
      text-align: center;
      color: black;
    }

    #currname {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translateX(-50%);
      font-size: 2vh;
      text-align: center;
      color: black;
      text-wrap: nowrap;
    }

    #namecard:active {
      background-color: white;
    }

    #namecard:active>#currname,
    #namecard:active>#currnickname {
      z-index: 1;
    }

    #passbutton,
    #gotitbutton {
      width: 25%;
      height: 30%;
      position: absolute;
      left: 0%;
      top: 35%;
      transform: translateY(-50%);
      background-color: black;
      color: white;
      box-sizing: border-box;
      border: none;
      font-size: 3vh;
      font-weight: bold;
      background-color: #a83232;
    }

    #gotitbutton {
      left: 75%;
      background-color: #32a852;
    }

    #passbutton:active,
    #gotitbutton:active {
      border: solid white 4px;
    }

    #timer {
      position: absolute;
      left: 50%;
      top: 75%;
      transform: translate(-50%, -50%) rotate(-90deg);
      width: 60%;
      aspect-ratio: 1;
    }

    #timerprogress {
      fill: none;
      stroke: orange;
      stroke-width: 5;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
    }

    #timerdisp {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      font-weight: bold;
      font-size: 10vh;
    }

    #endofroundcont,
    #endofturncont {
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #endofround,
    #endofturn {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 40%;
      background-color: black;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 2vh;
      border: solid 4px white;
    }

    #endofturn>span {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 3vh;
      text-wrap: nowrap;
    }

    #scorescont {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 3vh;
    }

    #endofround>button,
    #endofturn>button {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      height: 16%;
      width: 40%;
      border-radius: 99vh;
      font-size: 2vh;
      font-weight: bold;
      box-sizing: border-box;
      border: solid 4px white;
      background-color: black;
      color: white;
    }

    #namesearch {
      position: absolute;
      top: 0;
      left: 2%;
      width: 80%;
      height: 8%;
      background-color: grey;
      border-radius: 99vh;
      border: none;
      box-sizing: border-box;
      padding: 2vh;
      font-size: 4vh;
      color: lightgrey;
    }

    #namesearch::placeholder {
      color: lightgrey;
    }

    page#names>button.select,
    page#names>button.unselect {
      position: absolute;
      right: 2%;
      top: 4%;
      transform: translateY(-50%);

    #filtercont {
      position: absolute;
      top: 9%;
      width: 96%;
      height: 10%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: row;
      gap: 4px;
      flex-wrap: wrap;
    }

      background-color: grey;
      color: lightgrey;
      border-radius: 99vh;
      box-sizing: border-box;
      padding: 0.5vh;
      height: 40%;

      color: #444;

    name.hide {
      display: none;
    }

    .savebutton {
      position: absolute;
      top: -3%;
      transform: translateY(-100%);
      right: 2%;
      background-color: #003fa5;
      height: 6%;
      aspect-ratio: 2;
      color: white;
      border: none;
      border-radius: 99vh;
      font-size: 2vh;
      font-weight: bold;
    }

    #randomteamsbutton,
    #shuffleteamsbutton {
      position: absolute;
      top: -3%;
      transform: translateY(-100%);
      right: 22%;
      background-color: #777;
      height: 6%;
      aspect-ratio: 2;
      color: white;
      border: none;
      border-radius: 99vh;
      font-size: 2vh;
      font-weight: bold;
    }

    #shuffleteamsbutton {
      background-color: #444;
      right: 42%;
    }

    #teamscont {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      width: 96%;
      height: 96%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    teamcont {
      position: relative;
      width: 100%;
      height: 25%;
    }

    addteam {
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: #777;
      box-sizing: border-box;
      border: solid 20px #444;
    }

    addteam::before {
      content: "+ ADD TEAM";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #444;
      font-weight: bold;
      font-size: 3vh;
    }

    team {
      position: absolute;
      left: 100%;
      height: 100%;
      width: 100%;
      background-color: #888;
      transition: left 500ms;
      box-sizing: border-box;
      border: solid 10px #333;
    }

    team.show {
      left: 0%;
    }

    team>input {
      border: none;
      background-color: transparent;
      color: #444;
      outline: none;
      text-align: center;
    }

    team>input::placeholder {
      color: #444;
      text-align: center;
    }

    input.teamname {
      position: absolute;
      height: 30%;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      font-size: 3vh;
    }

    input.playername {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 50%;
      height: 20%;
      border: none;
      font-size: 2vh;
    }

    input.playername:nth-of-type(2) {
      bottom: 20%;
    }

    input.playername:nth-of-type(3) {
      bottom: 20%;
      left: 50%;
    }

    input.playername:nth-of-type(5) {
      left: 50%;
    }

    #genrandomcont {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80%;
      background-color: #444;
      box-sizing: border-box;
      padding: 10px;
    }

    #randomteamslist {
      width: calc(100% - 10px);
      height: 80%;
    }

    #generaterandomteams {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background-color: #777;
      height: 8%;
      aspect-ratio: 2;
      color: white;
      border: none;
      border-radius: 99vh;
      font-size: 2vh;
      font-weight: bold;
    }

    .xbutton {
      position: absolute;
      top: 10px;
      right: 10px;
      height: 30px;
      aspect-ratio: 1;
    }

    .hide {
      display: none;
    }

    #leaderboard {
      font-size: 4vh;
    }

    #leaderboard>button {
      box-sizing: border-box;
      aspect-ratio: 3;
      font-weight: bold;
      color: white;
      border: solid 4px white;
      background-color: black;
      border-radius: 99vh;
      font-size: 3vh;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="menubutton" onclick="menu.classList.toggle('show')"></div>
    <div id="menu" class="">
      <div id="itemcont">
        <item onclick="showPage('play')" style="font-size: 4vh">PLAY</item>
        <item onclick="showPage('teams')">Teams</item>
        <item onclick="showPage('names')">Names</item>
        <item onclick="showPage('leaderboard')">Leaderboard</item>
        <item>Timer Tick: <input id="timertick" type="checkbox" /></item>
      </div>
    </div>
    <page id="play">
      <button id="playbutton" onclick="g.start()">PLAY</button>
      <div id="playcont" class="hide">
        <span id="roundname">Physical Attributes</span>
        <span id="currteam">Team 1</span>
        <span id="currplayer">Cole's Turn</span>
        <button id="passbutton" onclick="g.pass()">PASS</button>
        <button id="gotitbutton" onclick="g.gotit()">GOT IT</button>
        <div id="namecard">
          <span id="currnickname">Aaron</span>
          <span id="currname">Aaron Nguyen</span>
          <span id="holdtosee">Hold to Reveal</span>
        </div>
        <div id="timer" onclick="g.timerhandler()">
          <svg viewBox="0 0 100 100">
            <circle id="timerprogress" cx="50" cy="50" r="45" pathLength="100" />
          </svg>
          <span id="timerdisp">60</span>
        </div>
        <div id="endofturncont">
          <div id="endofturn" class="">
            <span>Points this Turn: 0</span>
            <span style="top: 50%">Total Score: 0</span>
            <button onclick="g.nextTurn()">Next Turn</button>
          </div>
        </div>
        <div id="endofroundcont">
          <div id="endofround" class="">
            <h1 style="
                  position: absolute;
                  left: 50%;

    function showPage(name) {
      if (menu.classList.contains("show"))

      while (Array.from(document.querySelectorAll("page.show")).length > 0)
        document.querySelectorAll("page.show")[0].classList.remove("show");
      document.querySelector(`page#${name}`).classList.add("show");
      switch (name) {
        case "names":
          namecont.innerHTML = "";
          for (var name of g.names) {
            var n = document.createElement("name");
            n.innerHTML = `<span class="name">${name.name}</span>\n<span class="nickname">${name.nickname}</span>\n<button class="${name.selected ? "select" : "unselect"}" onclick="g.selectname(this)"></button>`;

            namecont.append(n);

          break;
        case "teams":
          for (var team in g.teams) {
            addteam(document.querySelectorAll("addteam")[team]);
            document.querySelector(`.teamname[tid='${team}']`).value =
              g.teams[team].teamname;
            for (var p in g.teams[team].players) {
              document.querySelector(
                `.teamname[tid='${team}'] ~ .playername[pid='${p}']`,
              ).value = g.teams[team].players[p];
            }
          }
          break;

          if (g.teams[0].score == undefined)
            leaderboard.innerHTML = "Game not Started";
          else {
            if (g.round <= 2) {
              var text = `<h1>Round ${g.round + 1}</h1><br />`;
              for (var team of g.teams) {
                text += `${team.teamname} | Score: ${team.score}<br />`;
              }

            } else {
              const sortedTeams = g.teams.toSorted(

              );

    function search(query) {
      for (var a of Array.from(document.querySelectorAll("name.hide")))

      for (var a of Array.from(document.querySelectorAll("name"))) {
        var flag = false;
        if (
          a.children[0].textContent
            .toLowerCase()
            .includes(query.toLowerCase())
        )
          flag = true;
        if (
          a.children[1].textContent
            .toLowerCase()
            .includes(query.toLowerCase())
        )
          flag = true;
        if (!flag) a.classList.add("hide");
      }

        this.timerchime.currentTime = 0;
        this.timerchime.play();
        this.runtimer = false;
        this.showendofturn();
      }
      showendofturn() {
        endofturncont.classList.remove("hide");
        endofturn.children[0].textContent = `Points this Turn: ${this.getteam().score - this.startingscore}`;
        endofturn.children[1].textContent = `Total Score: ${this.getteam().score}`;
      }
      showendofround() {
        endofroundcont.classList.remove("hide");
        const sortedTeams = this.teams.toSorted((a, b) => b.score - a.score);
        scorescont.innerHTML = "";
        for (var t of sortedTeams) {
          var s = document.createElement("span");
          s.textContent = `${t.teamname} | ${t.score}`;
          scorescont.append(s);
          scorescont.append(document.createElement("br"));
        }
      }
      getteam() {
        return this.teams[this.turn % this.teams.length];
      }
      start() {
        if (this.teams.length < 2)
          window.alert("cannot play with less than 2 teams");
        else if (!this.names.some((name) => name.selected))
          window.alert("no names selected to play with");
        else {
          this.running = true;
          playbutton.classList.add("hide");
          playcont.classList.remove("hide");
          this.teams.forEach((team) => (team.score = 0));
          this.nextRound();
        }
      }
      shufflenames() {
        var names = [];
        for (var n of this.names) {
          if (n.selected) names.push(n);
        }
        this.namepool = names;
      }
      nextRound() {
        endofroundcont.classList.add("hide");
        this.turn = -1;
        this.round++;
        if (this.round > 2) {
          showPage("leaderboard");
        } else {
          roundname.textContent = this.rounds[this.round];
          this.teams.forEach((team) => (team.namesdone = []));
          this.shufflenames();
          this.nextTurn();
        }
      }
      nextTurn() {
        endofturncont.classList.add("hide");
        this.turn++;
        this.startingscore = this.getteam().score;
        currteam.textContent = this.getteam().teamname;
        currplayer.textContent = `${this.getteam().players[Math.floor(this.turn / this.teams.length) % this.getteam().players.length]}'s Turn`;
        this.shufflenamepool();
        this.updnamecard();
        this.timer = 60;
        this.upd();
      }
      shufflenamepool() {
        var names = [];
        while (this.namepool.length) {
          names.push(
            this.namepool.splice(
              Math.floor(Math.random() * this.namepool.length),
              1,
            )[0],
          );
        }
        this.namepool = names;
      }
      pass() {
        this.namepool.push(this.namepool.shift());
        this.updnamecard();
      }
      gotit() {
        this.getteam().namesdone.push(this.namepool.shift());
        this.getteam().score++;
        if (this.namepool.length == 0) {
          this.showendofround();
        } else this.updnamecard();
      }
      updnamecard() {
        var n = this.namepool[0];
        currnickname.textContent = n.nickname;
        currname.textContent = n.name;
      }
      upd() {
        timerprogress.style.strokeDashoffset = 100 - (this.timer / 60) * 100;
        timerdisp.textContent = this.timer;
      }
      resetgame() {
        this.running = false;
        this.round = -1;
        this.turn = -1;
        this.timer = 60;
        clearInterval(this.timerinterval);
        this.timerinterval = null;
        this.runtimer = false;
        playbutton.classList.remove("hide");
        playcont.classList.add("hide");
        this.load();
      }
    }
    g = new Game();
    showPage("play");
    document.addEventListener("click", (e) => {
      if (e.target.tagName == "FILTER") {
        if (document.querySelector("filter.sel")) {
          if (document.querySelector("filter.sel") == e.target) {
            e.target.classList.remove("sel");
            setfilter("none");
          } else {
            document.querySelector("filter.sel").classList.remove("sel");
            e.target.classList.add("sel");
            setfilter(e.target.textContent.toLowerCase());
          }
        } else {
          e.target.classList.add("sel");
          setfilter(e.target.textContent.toLowerCase());
        }
      }
      if (e.target.tagName == "ADDTEAM") {
        addteam(e.target);
      }
    });
  </script>
</body>

</html>
